name: yotaxi-relay
services:
  relay:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - /opt/yotaxi-catalog/.env
      - .env
    ports:
      - "127.0.0.1:8031:8000"
    volumes:
      - leads:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options:
        max-size: "3m"
        max-file: "3"
volumes:
  leads:
