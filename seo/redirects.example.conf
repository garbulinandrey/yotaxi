# OPTIONAL snippets for the EXISTING hosting .htaccess.
# Do not upload this as a replacement .htaccess. Back up the real file first.
# Compatible rewrite syntax; do not add Apache 2.4 Require directives on Apache 2.2.
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Enable only after verifying that www.yotaxi.ru has working DNS and TLS.
    RewriteCond %{HTTP_HOST} ^www\.yotaxi\.ru(?::[0-9]+)?$ [NC]
    RewriteRule ^ https://yotaxi.ru%{REQUEST_URI} [R=301,L]

    # Canonical direct request for /index.html; preserves normal internal indexing.
    RewriteCond %{THE_REQUEST} \s/+index\.html(?:[?\s]) [NC]
    RewriteRule ^index\.html$ https://yotaxi.ru/ [R=301,L]
</IfModule>
# HTTPS redirects must account for SpaceWeb's reverse proxy.
# Prefer its hosting setting; an unconditional HTTPS=off rule may loop.
